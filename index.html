<!DOCTYPE html>
<html lang="fr">
<head><link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#12151b">

<title>Relais de classement — Fléchettes</title>

<style>

  :root{
    --bg:#12151b;
    --bg-soft:#181c24;
    --surface:#20252f;
    --surface-2:#262c38;
    --border:#333c4a;
    --text:#eef1f6;
    --text-dim:#8b96a8;
    --text-faint:#5c6678;

    --red:#d1495b;
    --red-dim:#5c2a32;

    --green:#2f9e6e;
    --green-dim:#1c4636;

    --gold:#e3b34e;
    --focus:#6fa8ff;

    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
  }


  /* =========================================================
     BASE / MOBILE
  ========================================================= */

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,
  body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
  }

  html{
    background:var(--bg);
  }

  body{
    background:var(--bg);
    color:var(--text);

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      Arial,
      sans-serif;

    overscroll-behavior:none;

    padding-bottom:
      env(safe-area-inset-bottom);
  }

  button,
  input{
    font-family:inherit;
  }

  button{
    cursor:pointer;
    touch-action:manipulation;
  }

  button:active{
    transform:scale(0.98);
  }

  button:focus-visible,
  input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }


  /* =========================================================
     APP
  ========================================================= */

  #app{
    width:100%;
    max-width:640px;
    min-height:100vh;
    min-height:100dvh;

    margin:0 auto;

    display:flex;
    flex-direction:column;

    padding-bottom:
      env(safe-area-inset-bottom);
  }

  .rim{
    height:6px;
    width:100%;
    flex-shrink:0;

    background:repeating-linear-gradient(
      90deg,
      var(--red) 0 28px,
      var(--bg-soft) 28px 32px,
      var(--green) 32px 60px,
      var(--bg-soft) 60px 64px
    );
  }

  .screen{
    width:100%;
    flex:1;

    padding:
      max(18px, env(safe-area-inset-top))
      16px
      calc(28px + env(safe-area-inset-bottom));

    display:flex;
    flex-direction:column;
    gap:18px;
  }


  /* =========================================================
     TYPO
  ========================================================= */

  h1{
    margin:0;
    font-size:1.55rem;
    line-height:1.2;
    letter-spacing:-0.02em;
  }

  h1 .accent{
    color:var(--red);
  }

  .subtitle{
    margin:0;

    color:var(--text-dim);

    font-size:0.93rem;
    line-height:1.5;
  }

  .section-title{
    margin:0;

    color:var(--text);
    font-size:0.95rem;
    font-weight:700;
  }

  .stack{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .row{
    display:flex;
    gap:8px;
    align-items:center;
  }


  /* =========================================================
     INPUTS JOUEURS
  ========================================================= */

  .player-row{
    width:100%;
  }

  .player-position{
    width:28px;
    flex-shrink:0;

    color:var(--text-faint);

    font-size:0.8rem;
    font-weight:700;

    text-align:center;
  }

  .player-row input[type=text]{
    flex:1;
    min-width:0;

    width:100%;

    background:var(--surface);

    border:1px solid var(--border);

    color:var(--text);

    font-size:1.05rem;

    padding:15px 14px;

    border-radius:var(--radius-sm);

    appearance:none;
  }

  .player-row input::placeholder{
    color:var(--text-faint);
  }

  .icon-btn{
    width:46px;
    height:46px;

    flex-shrink:0;

    border-radius:var(--radius-sm);

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--text-dim);

    font-size:1.05rem;

    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon-btn:disabled{
    opacity:0.25;
    cursor:default;
  }


  /* =========================================================
     JOUEURS ENREGISTRES
  ========================================================= */

  .saved-section{
    background:var(--bg-soft);

    border:1px solid var(--border);

    border-radius:var(--radius-md);

    padding:14px;

    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .saved-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }

  .saved-info{
    color:var(--text-faint);
    font-size:0.75rem;
    line-height:1.4;
  }

  .saved-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .saved-player{
    display:flex;
    align-items:center;
    gap:7px;

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--text);

    border-radius:999px;

    padding:9px 10px 9px 14px;

    font-size:0.88rem;
    font-weight:650;

    max-width:100%;
  }

  .saved-player .saved-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:180px;
  }

  .saved-player .saved-delete{
    width:22px;
    height:22px;

    border:none;

    background:transparent;

    color:var(--text-faint);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:0.8rem;

    padding:0;
  }

  .saved-player .saved-delete:active{
    background:var(--surface-2);
  }

  .save-player-btn{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--green);

    border-radius:var(--radius-sm);

    font-size:1.1rem;

    display:flex;
    align-items:center;
    justify-content:center;
  }

  .saved-empty{
    color:var(--text-faint);

    font-size:0.82rem;

    line-height:1.4;

    margin:0;
  }


  /* =========================================================
     AJOUT JOUEUR
  ========================================================= */

  .add-btn{
    width:100%;

    border:1px dashed var(--border);

    background:transparent;

    color:var(--text-dim);

    border-radius:var(--radius-sm);

    padding:15px;

    font-size:0.95rem;
    font-weight:600;
  }


  /* =========================================================
     REGLES
  ========================================================= */

  fieldset{
    border:none;
    margin:0;
    padding:0;
  }

  legend{
    font-size:0.85rem;
    color:var(--text-dim);

    margin-bottom:9px;

    padding:0;
  }

  .rule-options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .rule-option{
    display:flex;
    gap:12px;
    align-items:flex-start;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-sm);

    padding:13px;

    cursor:pointer;
  }

  .rule-option.checked{
    border-color:var(--green);
    background:var(--green-dim);
  }

  .rule-option input{
    width:18px;
    height:18px;

    flex-shrink:0;

    margin:1px 0 0;

    accent-color:var(--green);
  }

  .rule-option .t{
    font-weight:700;
    font-size:0.92rem;
  }

  .rule-option .d{
    display:inline-block;

    color:var(--text-dim);

    font-size:0.8rem;

    margin-top:2px;

    line-height:1.35;
  }


  /* =========================================================
     BOUTONS PRINCIPAUX
  ========================================================= */

  .primary-btn{
    width:100%;

    background:var(--green);

    color:#0d1912;

    border:none;

    font-weight:800;

    font-size:1.02rem;

    padding:17px;

    border-radius:var(--radius-md);

    letter-spacing:0.01em;

    min-height:54px;
  }

  .primary-btn:disabled{
    background:var(--surface-2);
    color:var(--text-faint);
  }

  .secondary-menu-btn{
    width:100%;

    background:transparent;

    border:1px solid var(--border);

    color:var(--text-dim);

    font-weight:650;

    font-size:0.95rem;

    padding:15px;

    border-radius:var(--radius-md);

    min-height:52px;
  }

  .error-msg{
    color:var(--red);

    font-size:0.84rem;

    min-height:1.1em;

    margin:0;
  }


  /* =========================================================
     ATTENTE
  ========================================================= */

  .player-card{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-md);

    padding:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;
  }

  .player-card .name{
    min-width:0;

    font-size:1.05rem;

    font-weight:650;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .win-btn{
    background:var(--red-dim);

    color:#ffd6da;

    border:1px solid var(--red);

    padding:12px 13px;

    border-radius:var(--radius-sm);

    font-weight:650;

    font-size:0.84rem;

    white-space:nowrap;

    min-height:44px;
  }


  /* =========================================================
     SAISIE SCORE
  ========================================================= */

  .progress{
    color:var(--text-faint);
    font-size:0.85rem;
    margin:0;
  }

  .collect-name{
    font-size:1.7rem;
    font-weight:800;
    margin:0;
  }

  .collect-display{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-md);

    padding:24px 20px;

    text-align:center;
  }

  .collect-display .num{
    font-size:3rem;

    font-weight:800;

    font-variant-numeric:tabular-nums;

    line-height:1;
  }

  .collect-display .num.placeholder{
    color:var(--text-faint);
  }

  .collect-display .unit{
    color:var(--text-dim);

    font-size:0.82rem;

    margin-top:7px;
  }


  /* =========================================================
     CLAVIER
  ========================================================= */

  .keypad{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;
  }

  .key{
    min-height:58px;

    background:var(--surface);

    border:1px solid var(--border);

    color:var(--text);

    font-size:1.35rem;

    font-weight:700;

    border-radius:var(--radius-sm);

    padding:12px 0;

    font-variant-numeric:tabular-nums;
  }

  .key.func{
    background:transparent;

    color:var(--text-dim);

    font-size:0.95rem;
  }

  /* =========================================================
     JEU
  ========================================================= */

  .leader-strip{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:2px;

    scrollbar-width:none;
  }

  .leader-strip::-webkit-scrollbar{
    display:none;
  }

  .chip{
    flex-shrink:0;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:999px;

    padding:7px 13px;

    font-size:0.8rem;

    display:flex;

    gap:6px;

    align-items:center;

    white-space:nowrap;
  }

  .chip .rk{
    font-weight:800;
  }

  .chip.gold{
    border-color:var(--gold);
    color:var(--gold);
  }

  .turn-panel{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-lg);

    padding:20px 18px;

    display:flex;

    flex-direction:column;

    gap:14px;
  }

  .turn-panel .who{
    color:var(--text-dim);
    font-size:0.85rem;
  }

  .turn-panel .who b{
    color:var(--text);
    font-size:1.15rem;
  }

  .remaining-num{
    font-size:3.5rem;

    font-weight:850;

    font-variant-numeric:tabular-nums;

    line-height:1;

    transition:color 0.15s;

    text-align:center;
  }

  .remaining-num.bad{
    color:var(--red);
  }

  .start-ref{
    color:var(--text-faint);
    font-size:0.78rem;
    margin-top:-7px;
    text-align:center;
  }

  .dart-slots{
    display:flex;
    gap:7px;
  }

  .dart-slot{
    flex:1;

    background:var(--bg-soft);

    border:1px solid var(--border);

    border-radius:var(--radius-sm);

    text-align:center;

    padding:11px 0;

    font-weight:750;

    font-size:1rem;

    color:var(--text-faint);
  }

  .dart-slot.filled{
    color:var(--text);
    border-color:var(--green);
  }

  .checkout-box{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    background:var(--bg-soft);

    border:1px solid var(--border);

    border-radius:var(--radius-sm);

    padding:12px;
  }

  .checkout-box .co-label{
    color:var(--text-dim);
    font-size:0.75rem;
    white-space:nowrap;
  }

  .checkout-box .co-path{
    font-weight:800;
    color:var(--green);
    font-size:1rem;
    text-align:right;
  }

  .checkout-box.none .co-path{
    color:var(--text-faint);
    font-weight:600;
    font-size:0.8rem;
  }

  .others-list{
    display:flex;

    flex-direction:column;

    gap:7px;
  }

  .other-row{
    display:flex;

    justify-content:space-between;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-sm);

    padding:10px 13px;

    font-size:0.88rem;

    color:var(--text-dim);
  }

  .other-row .r{
    font-variant-numeric:tabular-nums;
    color:var(--text);
    font-weight:700;
  }

  .mult-row{
    display:flex;
    gap:7px;
  }

  .mult-btn{
    flex:1;

    min-height:48px;

    padding:11px 0;

    border-radius:var(--radius-sm);

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--text-dim);

    font-weight:750;

    font-size:0.9rem;
  }

  .mult-btn.active{
    background:var(--green-dim);

    border-color:var(--green);

    color:#c9f5df;
  }

  .num-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:7px;
  }

  .num-key{
    min-height:52px;

    background:var(--surface);

    border:1px solid var(--border);

    color:var(--text);

    font-weight:750;

    font-size:1.05rem;

    border-radius:var(--radius-sm);

    padding:10px 0;

    font-variant-numeric:tabular-nums;
  }

  .special-row{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:7px;
  }

  .special-key{
    min-height:49px;

    background:var(--surface);

    border:1px solid var(--border);

    color:var(--text);

    font-weight:700;

    font-size:0.85rem;

    border-radius:var(--radius-sm);

    padding:10px 4px;
  }

  .ctrl-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;
  }

  .ctrl-btn{
    width:100%;

    background:transparent;

    border:1px solid var(--border);

    color:var(--text-dim);

    font-size:0.82rem;

    border-radius:var(--radius-sm);

    padding:13px 8px;

    min-height:48px;
  }

  .ctrl-btn.finish{
    background:var(--green);

    border:none;

    color:#0d1912;

    font-weight:800;

    grid-column:1 / -1;
  }

  .ctrl-btn.undo-global{
    width:100%;

    border-style:dashed;

    padding:12px;

    font-size:0.82rem;
  }

  .ctrl-btn.undo-global:disabled{
    opacity:0.35;
  }


  /* =========================================================
     FIN
  ========================================================= */

  .final-row{
    display:flex;

    align-items:center;

    gap:13px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-md);

    padding:15px;
  }

  .final-row .badge{
    width:38px;
    height:38px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;

    background:var(--surface-2);

    color:var(--text-dim);

    flex-shrink:0;
  }

  .final-row.p1 .badge{
    background:var(--gold);
    color:#3a2a05;
  }

  .final-row.p2 .badge{
    background:#c7ccd4;
    color:#2a2d33;
  }

  .final-row.p3 .badge{
    background:#c98a4b;
    color:#341f0c;
  }

  .final-row .name{
    font-size:1.02rem;
    font-weight:650;
    flex:1;
  }

  .end-buttons{
    display:flex;
    flex-direction:column;
    gap:9px;
  }


  /* =========================================================
     TOAST
  ========================================================= */

  .toast{
    position:fixed;

    top:max(16px, env(safe-area-inset-top));

    left:50%;

    transform:translateX(-50%);

    width:max-content;

    max-width:calc(100vw - 32px);

    background:var(--surface-2);

    border:1px solid var(--border);

    color:var(--text);

    padding:11px 17px;

    border-radius:999px;

    font-weight:700;

    font-size:0.85rem;

    z-index:50;

    opacity:0;

    pointer-events:none;

    transition:
      opacity 0.2s,
      transform 0.2s;

    text-align:center;
  }

  .toast.show{
    opacity:1;

    transform:
      translateX(-50%)
      translateY(6px);
  }

  .toast.bust{
    border-color:var(--red);
    color:#ffb9c1;
  }

  .toast.win{
    border-color:var(--gold);
    color:var(--gold);
  }


  /* =========================================================
     PETITS TELEPHONES
  ========================================================= */

  @media (max-width:380px){

    .screen{
      padding-left:12px;
      padding-right:12px;
    }

    h1{
      font-size:1.4rem;
    }

    .num-key{
      min-height:48px;
      font-size:1rem;
    }

    .special-key{
      font-size:0.75rem;
    }

    .remaining-num{
      font-size:3.15rem;
    }
  }


  /* =========================================================
     TABLET / GRAND ECRAN
  ========================================================= */

  @media (min-width:641px){

    #app{
      box-shadow:
        0 0 60px rgba(0,0,0,0.25);
    }

    .screen{
      padding-left:24px;
      padding-right:24px;
    }
  }

</style>
</head>


<body>

<div id="app">

  <div class="rim"></div>

  <div id="screen" class="screen"></div>

</div>

<div id="toast" class="toast"></div>


<script>

(function(){

  "use strict";

  /* =========================================================
     VOIX / CALLER
  ========================================================= */
  function playScore(score) {
    // Si le joueur fait 0, on lance le fichier 0.mp3 (Miss)
    var fileName = score;
    
    // On met bien "SONS" en majuscules pour correspondre à ton dossier
    var audio = new Audio('SONS/' + fileName + '.mp3');
    
    audio.play().catch(function(error) {
      console.warn("Fichier audio introuvable pour le score : " + score);
    });
  }


  /* =========================================================
     STOCKAGE DES JOUEURS
  ========================================================= */

  var SAVED_PLAYERS_KEY =
    "relais_classement_joueurs";


  function loadSavedPlayers(){

    try{

      var raw =
        localStorage.getItem(
          SAVED_PLAYERS_KEY
        );

      if (!raw){
        return [];
      }

      var data =
        JSON.parse(raw);

      if (!Array.isArray(data)){
        return [];
      }

      return data
        .filter(function(name){
          return (
            typeof name === "string" &&
            name.trim().length > 0
          );
        })
        .map(function(name){
          return name.trim();
        });

    }

    catch(error){

      return [];
    }
  }


  function saveSavedPlayers(list){

    try{

      localStorage.setItem(
        SAVED_PLAYERS_KEY,
        JSON.stringify(list)
      );

    }

    catch(error){

      console.warn(
        "Impossible de sauvegarder les joueurs.",
        error
      );
    }
  }


  var savedPlayers =
    loadSavedPlayers();


  /* =========================================================
     ETAT
  ========================================================= */

  var state = {

    phase:"setup",

    players:[],

    finishRule:"double",

    nextRank:2,

    collectQueue:[],
    collectIndex:0,
    collectBuffer:"",

    order:[],
    currentIdx:0,

    turnDarts:[],
    turnStartRemaining:0,
    currentMult:1,

    history:[]
  };


  var uidCounter = 1;


  /*
    L'ordre de setupNames représente toujours
    l'ordre dans lequel les joueurs démarrent
    la prochaine partie.
  */

  var setupNames =
    ["","",""];


  var screenEl =
    document.getElementById("screen");

  var toastEl =
    document.getElementById("toast");


  /* =========================================================
     HELPERS
  ========================================================= */

  function showToast(msg, kind){

    toastEl.textContent = msg;

    toastEl.className =
      "toast show" +
      (kind ? " " + kind : "");

    clearTimeout(
      showToast._t
    );

    showToast._t =
      setTimeout(function(){

        toastEl.className =
          "toast";

      }, 1700);
  }


  function byId(id){

    for (
      var i = 0;
      i < state.players.length;
      i++
    ){

      if (
        state.players[i].id === id
      ){

        return state.players[i];
      }
    }

    return null;
  }


  function escapeHtml(s){

    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }


  function cleanName(name){

    return String(name || "")
      .trim()
      .replace(/\s+/g," ");
  }


  /* =========================================================
     JOUEURS ENREGISTRES
  ========================================================= */

  function playerAlreadySaved(name){

    var target =
      cleanName(name).toLowerCase();

    return savedPlayers.some(
      function(player){

        return (
          player.toLowerCase() === target
        );
      }
    );
  }


  function savePlayer(name){

    name = cleanName(name);

    if (!name){
      showToast(
        "Entre d'abord un prénom.",
        "bust"
      );
      return;
    }

    if (playerAlreadySaved(name)){

      showToast(
        name + " est déjà enregistré."
      );

      return;
    }

    savedPlayers.push(name);

    saveSavedPlayers(
      savedPlayers
    );

    showToast(
      name + " enregistré !",
      "win"
    );

    renderSetup();
  }


  function deleteSavedPlayer(name){

    var target =
      cleanName(name).toLowerCase();

    savedPlayers =
      savedPlayers.filter(
        function(player){

          return (
            player.toLowerCase() !==
            target
          );
        }
      );

    saveSavedPlayers(
      savedPlayers
    );

    renderSetup();
  }


  /*
    Lorsqu'on appuie sur un joueur enregistré :

    1. On cherche le premier emplacement vide.
    2. S'il n'y en a aucun, on crée automatiquement
       un nouvel emplacement.
  */

  function addSavedPlayerToGame(name){

    name = cleanName(name);

    var emptyIndex = -1;

    for (
      var i = 0;
      i < setupNames.length;
      i++
    ){

      if (
        cleanName(
          setupNames[i]
        ) === ""
      ){

        emptyIndex = i;
        break;
      }
    }

    if (emptyIndex === -1){

      setupNames.push(name);

    } else {

      setupNames[
        emptyIndex
      ] = name;
    }

    renderSetup();

    /*
      Petite amélioration mobile :
      on fait défiler légèrement vers
      les joueurs après l'ajout.
    */

    setTimeout(function(){

      var rows =
        document.getElementById(
          "playerRows"
        );

      if (rows){

        rows.scrollIntoView({
          behavior:"smooth",
          block:"nearest"
        });
      }

    },50);
  }


  /* =========================================================
     DEMARRER UNE PARTIE
  ========================================================= */

  function startNewGameFromSetup(){

    var names =
      setupNames
        .map(function(n){
          return cleanName(n);
        })
        .filter(function(n){
          return n.length > 0;
        });


    if (names.length < 2){

      state.phase = "setup";

      render();

      return;
    }


    /*
      On remet les noms propres dans setupNames.
    */

    setupNames =
      names.slice();


    state.players =
      names.map(function(n){

        return {
          id:uidCounter++,
          name:n,
          rank:null,
          remaining:null
        };
      });


    state.nextRank = 2;

    state.collectQueue = [];
    state.collectIndex = 0;
    state.collectBuffer = "";

    state.order = [];
    state.currentIdx = 0;

    state.turnDarts = [];
    state.turnStartRemaining = 0;
    state.currentMult = 1;

    state.history = [];

    state.phase = "waiting";

    render();
  }


  /* =========================================================
     ROTATION DES JOUEURS
  ========================================================= */

  function rotatePlayersForNextGame(){

    if (setupNames.length <= 1){
      return;
    }

    /*
      A B C
      devient
      B C A

      Donc le joueur 1 passe
      à la dernière position.
    */

    var first =
      setupNames.shift();

    setupNames.push(first);
  }


  /* =========================================================
     MENU / RENDER
  ========================================================= */

  function render(){

    if (state.phase === "setup"){
      renderSetup();
    }

    else if (
      state.phase === "waiting"
    ){
      renderWaiting();
    }

    else if (
      state.phase === "collect"
    ){
      renderCollect();
    }

    else if (
      state.phase === "game"
    ){
      renderGame();
    }

    else if (
      state.phase === "end"
    ){
      renderEnd();
    }
  }


  /* =========================================================
     SETUP
  ========================================================= */

      .querySelectorAll(

      .querySelectorAll(

      .forEach(

              );

      .querySelectorAll(

      .getElementById(

              })
              .filter(function(n){

              });

     WAITING

    html +=

      '</p>';


    html +=
      '<div class="stack">';


    state.players.forEach(
      function(p){

        html +=
          '<div class="player-card">';


        html +=
          '<span class="name">' +
          escapeHtml(p.name) +
          '</span>';


        html +=
          '<button class="win-btn" ' +
          'data-win="' + p.id + '">' +

        html +=

  function declareWinner(id){

    var winner =
      byId(id);


    if (!winner){
      return;
    }


    winner.rank = 1;

    state.nextRank = 2;


    var remaining =
      state.players.filter(
        function(p){
          return p.rank === null;
        }
      );


    if (remaining.length === 1){

      remaining[0].rank =
        state.nextRank++;

      state.phase = "end";

      render();

      return;
    }


    state.collectQueue =
      remaining.map(
        function(p){
          return p.id;
        }
      );


    state.collectIndex = 0;
    state.collectBuffer = "";

    state.phase = "collect";

    render();
  }


  /* =========================================================
     COLLECT
  ========================================================= */

  function renderCollect(){

    var pid =
      state.collectQueue[
        state.collectIndex
      ];


    var p =
      byId(pid);


    if (!p){

      startGamePhase();

      return;
    }


    var html = "";


    html +=
      '<h1>Score restant</h1>';


    html +=
      '<p class="progress">' +
      'Joueur ' +
      (state.collectIndex + 1) +
      ' sur ' +
      state.collectQueue.length +
      '</p>';


    html +=
      '<p class="collect-name">' +
      escapeHtml(p.name) +
      '</p>';


    html +=
      '<div class="collect-display">';


    html +=
      '<div class="num' +
      (
        state.collectBuffer === ""
          ? ' placeholder'
          : ''
      ) +
      '">';


    html +=
      state.collectBuffer === ""
        ? "0"
        : state.collectBuffer;


    html +=
      '</div>';


    html +=
      '<div class="unit">' +
      'points restants actuellement' +
      '</div>';


    html +=
      '</div>';


    html +=
      '<div class="keypad">';


    [
      "1","2","3",
      "4","5","6",
      "7","8","9"
    ].forEach(
      function(d){

        html +=
          '<button class="key" ' +
          'data-digit="' + d + '">' +
          d +
          '</button>';
      }
    );


    html +=
      '<button class="key func" ' +
      'data-clear="1">' +
      'Effacer' +
      '</button>';


    html +=
      '<button class="key" ' +
      'data-digit="0">' +
      '0' +
      '</button>';


    html +=
      '<button class="key func" ' +
      'data-back="1">' +
      '&#9003;' +
      '</button>';


    html +=
      '</div>';


    html +=
      '<button class="primary-btn" ' +
      'id="collectValidate" ' +
      (
        state.collectBuffer === ""
          ? "disabled"
          : ""
      ) +
      '>' +
      'Valider' +
      '</button>';


    screenEl.innerHTML =
      html;


    /* ---------- Chiffres ---------- */

    document
      .querySelectorAll('[data-digit]')
      .forEach(
        function(btn){

          btn.addEventListener(
            "click",
            function(){

              if (
                state.collectBuffer.length >= 3
              ){
                return;
              }


              if (
                state.collectBuffer === "0"
              ){
                state.collectBuffer = "";
              }


              state.collectBuffer +=
                btn.dataset.digit;


              renderCollect();
            }
          );
        }
      );


    /* ---------- Effacer ---------- */

    document
      .querySelector(
        '[data-clear]'
      )
      .addEventListener(
        "click",
        function(){

          state.collectBuffer = "";

          renderCollect();
        }
      );


    /* ---------- Retour ---------- */

    document
      .querySelector(
        '[data-back]'
      )
      .addEventListener(
        "click",
        function(){

          state.collectBuffer =
            state.collectBuffer.slice(0,-1);

          renderCollect();
        }
      );


    /* ---------- Valider ---------- */

    var vbtn =
      document.getElementById(
        "collectValidate"
      );


    if (vbtn){

      vbtn.addEventListener(
        "click",
        function(){

          var val =
            parseInt(
              state.collectBuffer,
              10
            );


          if (isNaN(val)){
            return;
          }


          p.remaining = val;


          if (val === 0){

            p.rank =
              state.nextRank++;
          }


          state.collectIndex++;
          state.collectBuffer = "";


          if (
            state.collectIndex <
            state.collectQueue.length
          ){

            renderCollect();

          }

          else{

            startGamePhase();
          }
        }
      );
    }
  }


  /* =========================================================
     START GAME
  ========================================================= */

  function startGamePhase(){

    state.order =
      state.collectQueue.filter(
        function(id){

          var p = byId(id);

          return (
            p &&
            p.rank === null
          );
        }
      );


    if (state.order.length <= 1){

      if (
        state.order.length === 1
      ){

        byId(
          state.order[0]
        ).rank =
          state.nextRank++;
      }


      state.phase = "end";

      render();

      return;
    }


    state.currentIdx = 0;

    state.turnDarts = [];

    state.currentMult = 1;


    state.turnStartRemaining =
      byId(
        state.order[
          state.currentIdx
        ]
      ).remaining;


    state.phase = "game";

    render();
  }


  /* =========================================================
     CHECKOUT
  ========================================================= */

  var ALL_DART_OPTIONS =
    (function(){

      var opts = [];


      opts.push({
        value:50,
        label:"Bull",
        isDouble:true,
        isTriple:false
      });


      for (
        var n = 20;
        n >= 1;
        n--
      ){

        opts.push({
          value:n * 3,
          label:"T" + n,
          isDouble:false,
          isTriple:true
        });
      }


      for (
        var n2 = 20;
        n2 >= 1;
        n2--
      ){

        opts.push({
          value:n2 * 2,
          label:"D" + n2,
          isDouble:true,
          isTriple:false
        });
      }


      opts.push({
        value:25,
        label:"25",
        isDouble:false,
        isTriple:false
      });


      for (
        var n3 = 20;
        n3 >= 1;
        n3--
      ){

        opts.push({
          value:n3,
          label:String(n3),
          isDouble:false,
          isTriple:false
        });
      }


      opts.sort(
        function(a,b){
          return b.value - a.value;
        }
      );


      return opts;

    })();


  function isValidFinisher(
    dart,
    rule
  ){

    if (
      rule === "straight"
    ){
      return true;
    }


    if (
      rule === "double"
    ){
      return dart.isDouble;
    }


    if (
      rule === "master"
    ){
      return (
        dart.isDouble ||
        dart.isTriple
      );
    }


    return false;
  }


  function findCheckout(
    remaining,
    dartsLeft,
    rule
  ){

    if (
      remaining <= 0 ||
      dartsLeft <= 0
    ){
      return null;
    }


    if (
      remaining === 1 &&
      rule !== "straight"
    ){
      return null;
    }


    for (
      var used = 1;
      used <= dartsLeft;
      used++
    ){

      var res =
        searchCombo(
          remaining,
          used,
          rule
        );


      if (res){
        return res;
      }
    }


    return null;
  }


  function searchCombo(
    remaining,
    count,
    rule
  ){

    if (count === 1){

      for (
        var i = 0;
        i < ALL_DART_OPTIONS.length;
        i++
      ){

        var d =
          ALL_DART_OPTIONS[i];


        if (
          d.value === remaining &&
          isValidFinisher(
            d,
            rule
          )
        ){

          return [d];
        }
      }


      return null;
    }


    for (
      var j = 0;
      j < ALL_DART_OPTIONS.length;
      j++
    ){

      var d2 =
        ALL_DART_OPTIONS[j];


      if (
        d2.value < remaining
      ){

        var rest =
          searchCombo(
            remaining - d2.value,
            count - 1,
            rule
          );


        if (rest){

          return [d2].concat(
            rest
          );
        }
      }
    }


    return null;
  }


  /* =========================================================
     JEU
  ========================================================= */

  function dartLabel(
    mult,
    num
  ){

    if (num === "BULL50"){
      return "Bull";
    }

    if (num === "BULL25"){
      return "25";
    }

    if (num === 0){
      return "-";
    }


    var pfx =
      mult === 3
        ? "T"
        : mult === 2
          ? "D"
          : "";


    return pfx + num;
  }


  function renderGame(){

    var currentId =
      state.order[
        state.currentIdx
      ];


    var current =
      byId(currentId);


    if (!current){
      return;
    }


    var total =
      state.turnDarts.reduce(
        function(s,d){
          return s + d.points;
        },
        0
      );


    var preview =
      state.turnStartRemaining -
      total;


    var html = "";


    /* ---------- Classement ---------- */

    html +=
      '<div class="leader-strip">';


    state.players
      .filter(function(p){
        return p.rank !== null;
      })
      .sort(function(a,b){
        return a.rank - b.rank;
      })
      .forEach(
        function(p){

          html +=
            '<div class="chip' +
            (
              p.rank === 1
                ? ' gold'
                : ''
            ) +
            '">';


          html +=
            '<span class="rk">' +
            p.rank +
            '</span>';


          html +=
            '<span>' +
            escapeHtml(p.name) +
            '</span>';


          html +=
            '</div>';
        }
      );


    html +=
      '</div>';


    /* ---------- Undo ---------- */

    html +=
      '<button ' +
      'class="ctrl-btn undo-global" ' +
      'id="undoLastTurn" ' +
      (
        state.history.length === 0
          ? "disabled"
          : ""
      ) +
      '>' +
      '&#8630; Annuler le dernier tour validé' +
      '</button>';


    /* ---------- Calcul ---------- */

    var isBad =
      preview < 0 ||
      (
        preview === 1 &&
        state.finishRule !==
        "straight"
      );


    var dartsLeft =
      3 -
      state.turnDarts.length;


    var checkout =
      (
        !isBad &&
        preview > 0 &&
        preview <= 170 &&
        dartsLeft > 0
      )
        ? findCheckout(
            preview,
            dartsLeft,
            state.finishRule
          )
        : null;


    /* ---------- Panel ---------- */

    html +=
      '<div class="turn-panel">';


    html +=
      '<div class="who">' +
      'Au tour de<br>' +
      '<b>' +
      escapeHtml(
        current.name
      ) +
      '</b>' +
      '</div>';


    html +=
      '<div class="remaining-num' +
      (
        isBad
          ? ' bad'
          : ''
      ) +
      '">' +
      preview +
      '</div>';


    if (
      state.turnDarts.length
    ){

      html +=
        '<div class="start-ref">' +
        'Début de tour : ' +
        state.turnStartRemaining +
        '</div>';
    }


    html +=
      '<div class="dart-slots">';


    for (
      var i = 0;
      i < 3;
      i++
    ){

      var d =
        state.turnDarts[i];


      html +=
        '<div class="dart-slot' +
        (
          d
            ? ' filled'
            : ''
        ) +
        '">' +
        (
          d
            ? d.label
            : "—"
        ) +
        '</div>';
    }


    html +=
      '</div>';


    /* ---------- Checkout ---------- */

    if (
      preview > 0 &&
      preview <= 170 &&
      dartsLeft > 0
    ){

      if (checkout){

        html +=
          '<div class="checkout-box">';


        html +=
          '<span class="co-label">' +
          'Sortie en ' +
          checkout.length +
          ' fléchette' +
          (
            checkout.length > 1
              ? 's'
              : ''
          ) +
          '</span>';


        html +=
          '<span class="co-path">' +
          checkout
            .map(function(d){
              return d.label;
            })
            .join(" &rarr; ") +
          '</span>';


        html +=
          '</div>';

      }

      else{

        html +=
          '<div class="checkout-box none">';


        html +=
          '<span class="co-label">' +
          'Sortie' +
          '</span>';


        html +=
          '<span class="co-path">' +
          'Pas de sortie directe' +
          '</span>';


        html +=
          '</div>';
      }
    }


    html +=
      '</div>';


    /* ---------- Autres joueurs ---------- */

    var others =
      state.order.filter(
        function(id){
          return id !== currentId;
        }
      );


    if (others.length){

      html +=
        '<div class="others-list">';


      others.forEach(
        function(id){

          var p =
            byId(id);


          html +=
            '<div class="other-row">';


          html +=
            '<span>' +
            escapeHtml(p.name) +
            '</span>';


          html +=
            '<span class="r">' +
            p.remaining +
            '</span>';


          html +=
            '</div>';
        }
      );


      html +=
        '</div>';
    }


    /* ---------- Multiplicateurs ---------- */

    html +=
      '<div class="mult-row">';


    [
      [1,"Simple"],
      [2,"Double"],
      [3,"Triple"]
    ].forEach(
      function(m){

        html +=
          '<button ' +
          'class="mult-btn' +
          (
            state.currentMult === m[0]
              ? ' active'
              : ''
          ) +
          '" ' +
          'data-mult="' +
          m[0] +
          '">' +
          m[1] +
          '</button>';
      }
    );


    html +=
      '</div>';


    /* ---------- Numéros ---------- */

    html +=
      '<div class="num-grid">';


    for (
      var n = 1;
      n <= 20;
      n++
    ){

      html +=
        '<button ' +
        'class="num-key" ' +
        'data-num="' +
        n +
        '">' +
        n +
        '</button>';
    }


    html +=
      '</div>';


    /* ---------- Spéciaux ---------- */

    html +=
      '<div class="special-row">';


    html +=
      '<button ' +
      'class="special-key" ' +
      'data-bull25="1">' +
      '25' +
      '</button>';


    html +=
      '<button ' +
      'class="special-key" ' +
      'data-bull50="1">' +
      'Bull (50)' +
      '</button>';


    html +=
      '<button ' +
      'class="special-key" ' +
      'data-miss="1">' +
      'Raté (0)' +
      '</button>';


    html +=
      '</div>';


    /* ---------- Contrôles ---------- */

    html +=
      '<div class="ctrl-row">';


    html +=
      '<button ' +
      'class="ctrl-btn" ' +
      'id="undoDart" ' +
      (
        state.turnDarts.length === 0
          ? "disabled"
          : ""
      ) +
      '>' +
      'Annuler fléchette' +
      '</button>';


    html +=
      '<button ' +
      'class="ctrl-btn" ' +
      'id="cancelTurn" ' +
      (
        state.turnDarts.length === 0
          ? "disabled"
          : ""
      ) +
      '>' +
      'Annuler le tour' +
      '</button>';


    html +=
      '<button ' +
      'class="ctrl-btn finish" ' +
      'id="endTurn" ' +
      (
        state.turnDarts.length === 0
          ? "disabled"
          : ""
      ) +
      '>' +
      'Terminer le tour' +
      '</button>';


    html +=
      '</div>';


    screenEl.innerHTML =
      html;


    /* ---------- Multiplicateurs ---------- */

    document
      .querySelectorAll(
        '[data-mult]'
      )
      .forEach(
        function(btn){

          btn.addEventListener(
            "click",
            function(){

              state.currentMult =
                parseInt(
                  btn.dataset.mult,
                  10
                );

              renderGame();
            }
          );
        }
      );


    /* ---------- Numéros ---------- */

    document
      .querySelectorAll(
        '[data-num]'
      )
      .forEach(
        function(btn){

          btn.addEventListener(
            "click",
            function(){

              var num =
                parseInt(
                  btn.dataset.num,
                  10
                );


              var mult =
                state.currentMult;


              addDart(
                num * mult,
                dartLabel(
                  mult,
                  num
                ),
                mult === 2,
                mult === 3
              );
            }
          );
        }
      );


    /* ---------- Bull 25 ---------- */

    document
      .querySelector(
        '[data-bull25]'
      )
      .addEventListener(
        "click",
        function(){

          addDart(
            25,
            "25",
            false,
            false
          );
        }
      );


    /* ---------- Bull 50 ---------- */

    document
      .querySelector(
        '[data-bull50]'
      )
      .addEventListener(
        "click",
        function(){

          addDart(
            50,
            "Bull",
            true,
            false
          );
        }
      );


    /* ---------- Raté ---------- */

    document
      .querySelector(
        '[data-miss]'
      )
      .addEventListener(
        "click",
        function(){

          addDart(
            0,
            "-",
            false,
            false
          );
        }
      );


    /* ---------- Undo dart ---------- */

    document
      .getElementById(
        "undoDart"
      )
      .addEventListener(
        "click",
        function(){

          state.turnDarts.pop();

          renderGame();
        }
      );


    /* ---------- Annuler tour ---------- */

    document
      .getElementById(
        "cancelTurn"
      )
      .addEventListener(
        "click",
        function(){

          state.turnDarts = [];

          state.currentMult = 1;

          renderGame();
        }
      );


    /* ---------- Terminer ---------- */

    document
      .getElementById(
        "endTurn"
      )
      .addEventListener(
        "click",
        finalizeTurn
      );


    /* ---------- Undo global ---------- */

    var undoBtn =
      document.getElementById(
        "undoLastTurn"
      );


    if (undoBtn){

      undoBtn.addEventListener(
        "click",
        undoLastTurn
      );
    }
  }


  /* =========================================================
     DART
  ========================================================= */

  function addDart(
    points,
    label,
    isDouble,
    isTriple
  ){

    if (
      state.turnDarts.length >= 3
    ){
      return;
    }
    
    playScore(points);

    state.turnDarts.push({

      points:points,

      label:label,

      isDouble:isDouble,

      isTriple:isTriple

    });


    state.currentMult = 1;


    var total =
      state.turnDarts.reduce(
        function(s,d){
          return s + d.points;
        },
        0
      );


    var preview =
      state.turnStartRemaining -
      total;


    if (
      state.turnDarts.length === 3 ||
      preview <= 0
    ){

      finalizeTurn();

    }

    else{

      renderGame();
    }
  }


  /* =========================================================
     HISTORIQUE / UNDO
  ========================================================= */

  function pushHistory(){

    state.history.push({

      players:
        JSON.parse(
          JSON.stringify(
            state.players
          )
        ),

      order:
        state.order.slice(),

      currentIdx:
        state.currentIdx,

      nextRank:
        state.nextRank,

      phase:
        state.phase

    });
  }


  function undoLastTurn(){

    if (
      state.history.length === 0
    ){
      return;
    }


    var snap =
      state.history.pop();


    state.players =
      snap.players;

    state.order =
      snap.order;

    state.currentIdx =
      snap.currentIdx;

    state.nextRank =
      snap.nextRank;

    state.phase =
      snap.phase;


    state.turnDarts = [];

    state.currentMult = 1;


    if (
      state.order.length
    ){

      var current =
        byId(
          state.order[
            state.currentIdx
          ]
        );


      if (current){

        state.turnStartRemaining =
          current.remaining;
      }
    }


    showToast(
      "Dernier tour annulé"
    );


    render();
  }


  /* =========================================================
     FINALIZE TURN
  ========================================================= */

  function finalizeTurn(){

    pushHistory();


    var currentId =
      state.order[
        state.currentIdx
      ];


    var current =
      byId(currentId);


    if (!current){
      return;
    }


    var total =
      state.turnDarts.reduce(
        function(s,d){
          return s + d.points;
        },
        0
      );


    var newRemaining =
      state.turnStartRemaining -
      total;


    var lastDart =
      state.turnDarts.length
        ? state.turnDarts[
            state.turnDarts.length - 1
          ]
        : null;


    var bust = false;


    if (
      newRemaining < 0
    ){

      bust = true;

    }

    else if (
      newRemaining === 0
    ){

      if (
        state.finishRule === "double" &&
        !(
          lastDart &&
          lastDart.isDouble
        )
      ){

        bust = true;
      }


      if (
        state.finishRule === "master" &&
        !(
          lastDart &&
          (
            lastDart.isDouble ||
            lastDart.isTriple
          )
        )
      ){

        bust = true;
      }
    }

    else if (
      newRemaining === 1 &&
      state.finishRule !==
      "straight"
    ){

      bust = true;
    }


    state.turnDarts = [];

    state.currentMult = 1;


    if (bust){

      showToast(
        current.name +
        " — bust, le tour ne compte pas",
        "bust"
      );


      advanceTurn(false);

      return;
    }


    current.remaining =
      newRemaining;


    if (
      newRemaining === 0
    ){

      current.rank =
        state.nextRank++;


      showToast(
        current.name +
        " termine " +
        ordinal(
          current.rank
        ) +
        " !",
        "win"
      );


      advanceTurn(true);

    }

    else{

      advanceTurn(false);
    }
  }


  function ordinal(n){

    return n === 1
      ? "1er"
      : n + "e";
  }


  /* =========================================================
     TOUR SUIVANT
  ========================================================= */

  function advanceTurn(
    playerFinished
  ){

    if (playerFinished){

      state.order.splice(
        state.currentIdx,
        1
      );


      if (
        state.order.length === 1
      ){

        byId(
          state.order[0]
        ).rank =
          state.nextRank++;


        state.phase = "end";

        render();

        return;
      }


      if (
        state.currentIdx >=
        state.order.length
      ){

        state.currentIdx = 0;
      }

    }

    else{

      state.currentIdx =
        (
          state.currentIdx + 1
        ) %
        state.order.length;
    }


    state.turnStartRemaining =
      byId(
        state.order[
          state.currentIdx
        ]
      ).remaining;


    render();
  }


  /* =========================================================
     FIN
  ========================================================= */

  function renderEnd(){

    var sorted =
      state.players
        .slice()
        .sort(
          function(a,b){
            return a.rank - b.rank;
          }
        );


    var html = "";


    html +=
      '<h1>Classement final</h1>';


    html +=
      '<p class="subtitle">' +
      'La partie est terminée, voici le classement final.' +
      '</p>';


    html +=
      '<div class="stack">';


    sorted.forEach(
      function(p){

        var cls =
          p.rank === 1
            ? "p1"
            : p.rank === 2
              ? "p2"
              : p.rank === 3
                ? "p3"
                : "";


        html +=
          '<div class="final-row ' +
          cls +
          '">';


        html +=
          '<span class="badge">' +
          p.rank +
          '</span>';


        html +=
          '<span class="name">' +
          escapeHtml(p.name) +
          '</span>';


        html +=
          '</div>';
      }
    );


    html +=
      '</div>';


    if (
      state.history.length
    ){

      html +=
        '<button ' +
        'class="ctrl-btn undo-global" ' +
        'id="undoLastTurn">' +
        '&#8630; Annuler le dernier tour validé' +
        '</button>';
    }


    html +=
      '<div class="end-buttons">';


    html +=
      '<button ' +
      'class="primary-btn" ' +
      'id="newGameBtn">' +
      'Nouvelle partie' +
      '</button>';


    html +=
      '<button ' +
      'class="secondary-menu-btn" ' +
      'id="menuBtn">' +
      'Retour au menu principal' +
      '</button>';


    html +=
      '</div>';


    screenEl.innerHTML =
      html;


    /* ---------- Undo ---------- */

    var undoBtn =
      document.getElementById(
        "undoLastTurn"
      );


    if (undoBtn){

      undoBtn.addEventListener(
        "click",
        undoLastTurn
      );
    }


    /* =======================================================
       NOUVELLE PARTIE

       A B C
       devient
       B C A

       puis :

       B C A
       devient
       C A B

       puis :

       C A B
       devient
       A B C
    ======================================================= */

    document
      .getElementById(
        "newGameBtn"
      )
      .addEventListener(
        "click",
        function(){

          rotatePlayersForNextGame();

          startNewGameFromSetup();
        }
      );


    /* ---------- Menu principal ---------- */

    document
      .getElementById(
        "menuBtn"
      )
      .addEventListener(
        "click",
        function(){

          /*
            On récupère l'ordre actuel
            des joueurs pour l'afficher
            dans le menu.
          */

          setupNames =
            state.players
              .slice()
              .sort(
                function(a,b){

                  /*
                    On remet les joueurs
                    dans l'ordre du tableau
                    actuel si possible.
                  */

                  var ia =
                    state.order.indexOf(
                      a.id
                    );

                  var ib =
                    state.order.indexOf(
                      b.id
                    );

                  if (ia === -1) ia = 999;
                  if (ib === -1) ib = 999;

                  return ia - ib;
                }
              )
              .map(function(p){
                return p.name;
              });


          /*
            Pour éviter de perdre les joueurs
            qui avaient déjà été classés.
          */

          if (
            setupNames.length <
            state.players.length
          ){

            setupNames =
              state.players.map(
                function(p){
                  return p.name;
                }
              );
          }


          state.phase = "setup";

          state.players = [];

          state.nextRank = 2;

          state.collectQueue = [];
          state.collectIndex = 0;
          state.collectBuffer = "";

          state.order = [];
          state.currentIdx = 0;

          state.turnDarts = [];
          state.currentMult = 1;
          state.turnStartRemaining = 0;

          state.history = [];

          render();
        }
      );
  }


  /* =========================================================
     DEMARRAGE
  ========================================================= */

  render();

})();

</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch((err) => console.log('Erreur Service Worker :', err));
    });
  }
</script>
</body>
</html>
